name: publish-@sparklings/reksadata

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm provenance

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          scope: "@sparklings"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build reksadata package
        run: bunx turbo run build --filter=@sparklings/reksadata

      - name: Run typecheck
        run: bunx turbo run typecheck --filter=@sparklings/reksadata

      - name: Publish to npm
        run: cd packages/reksadata && npm publish --provenance

      - name: Get published version
        id: package-version
        run: |
          VERSION=$(node -p "require('./packages/reksadata/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create summary
        run: |
          echo "## ✅ Published @sparklings/reksadata@${{ steps.package-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Package is now available at:" >> $GITHUB_STEP_SUMMARY
          echo "https://www.npmjs.com/package/@sparklings/reksadata/v/${{ steps.package-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
