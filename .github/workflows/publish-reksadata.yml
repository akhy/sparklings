name: publish-@sparklings/reksadata

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm provenance

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false # Prevents auto install so caching works better with setup-node

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"
          scope: "@sparklings"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build reksadata package
        run: pnpm --filter=@sparklings/reksadata build

      - name: Run typecheck
        run: pnpm --filter=@sparklings/reksadata typecheck

      - name: Publish to npm
        run: pnpm --filter=@sparklings/reksadata publish

      - name: Get published version
        id: package-version
        run: |
          VERSION=$(node -p "require('./packages/reksadata/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create summary
        run: |
          echo "## ✅ Published @sparklings/reksadata@${{ steps.package-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Package is now available at:" >> $GITHUB_STEP_SUMMARY
          echo "https://www.npmjs.com/package/@sparklings/reksadata/v/${{ steps.package-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
